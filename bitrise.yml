---
format_version: '23'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: other
workflows:
  primary:
    steps:
    - git-clone: {}
    - custom-test-results-export:
        title: Export report A
        inputs:
        - base_path: $BITRISE_SOURCE_DIR/report-a
        - search_pattern: "*/report-a/test-results.xml"
        - test_name: report-a
    - custom-test-results-export:
        title: Export report B
        inputs:
        - base_path: $BITRISE_SOURCE_DIR/report-b
        - search_pattern: "*/report-b/test-results.xml"
        - test_name: report-b
    - deploy-to-bitrise-io: {}
meta:
  bitrise.io:
    stack: ubuntu-noble-24.04-bitrise-2025-android
    machine_type_id: g2.linux.medium
